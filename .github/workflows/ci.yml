name: CI
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        env:
          YARN_ENABLE_HARDENED_MODE: false
        run: yarn install --immutable

      # SLS integration tests remain opt-in because they require the local Serverless test setup.
      - name: Install ClamAV
        run: sudo apt-get update && sudo apt-get install -y clamav clamav-daemon

      - name: Cache ClamAV database
        id: cache
        uses: actions/cache@v6
        with:
          path: /var/lib/clamav
          key: clamav-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            clamav-${{ runner.os }}-

      - name: Update ClamAV database
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo freshclam || true

      - name: Build native addon
        run: yarn build
      - name: Lint
        run: yarn lint
      - name: Run tests
        run: yarn test
      - name: Generate coverage
        run: yarn c8 -r lcov --all yarn test
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          flag-name: ${{ matrix.node-version }}
          parallel: true

  finish:
    needs: node
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
